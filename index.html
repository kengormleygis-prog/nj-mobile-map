        var map = L.map('map', {

        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

        addressSearchControl.getContainer().querySelector('input').setAttribute('aria-label', 'Search an address');
        var locationButton;
        var userLocationMarker;
        var userLocationAccuracy;
        function locateUser() {
            if (!navigator.geolocation) {
                alert('Location is not supported by this browser.');
                return;
            }
            locationButton.disabled = true;
            locationButton.setAttribute('aria-busy', 'true');
            navigator.geolocation.getCurrentPosition(function (position) {
                var location = L.latLng(position.coords.latitude, position.coords.longitude);
                var accuracy = position.coords.accuracy;
                userLocationLatLng = location;
                if (!userLocationAccuracy) {
                    userLocationAccuracy = L.circle(location, accuracy, {
                        color: '#60a5fa',
                        weight: 1,
                        fillColor: '#3b82f6',
                        fillOpacity: 0.18
                    }).addTo(map);
                    userLocationMarker = L.circleMarker(location, {
                        radius: 8,
                        color: '#ffffff',
                        weight: 3,
                        fillColor: '#2563eb',
                        fillOpacity: 1
                    }).addTo(map);
                } else {
                    userLocationAccuracy.setLatLng(location).setRadius(accuracy);
                    userLocationMarker.setLatLng(location);
                }
                userLocationMarker.bindPopup('Your location (accuracy: ' + Math.round(accuracy) + ' m)');
                map.setView(location, Math.max(map.getZoom(), 16));
                locationButton.disabled = false;
                locationButton.removeAttribute('aria-busy');
            }, function (error) {
                var message = 'Could not get your location. Please try again.';
                if (error.code === error.PERMISSION_DENIED) {
                    message = 'Location permission was denied. Allow location access in your browser settings to use this feature.';
                } else if (error.code === error.POSITION_UNAVAILABLE) {
                    message = 'Your location is currently unavailable. Please try again.';
                } else if (error.code === error.TIMEOUT) {
                    message = 'The location request timed out. Please try again.';
                }
                locationButton.disabled = false;
                locationButton.removeAttribute('aria-busy');
                alert(message);
            }, {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 60000
            });
        }
        var locationControl = L.control({ position: 'topleft' });
        locationControl.onAdd = function () {
            var container = L.DomUtil.create('div', 'leaflet-control-location');
            locationButton = L.DomUtil.create('button', 'location-button', container);
            locationButton.type = 'button';
            locationButton.title = 'Show my location';
            locationButton.setAttribute('aria-label', 'Show my location');
            locationButton.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"></circle><path d="M12 2v3m0 14v3M2 12h3m14 0h3"></path></svg>';
            L.DomEvent.disableClickPropagation(container);
            L.DomEvent.on(locationButton, 'click', locateUser);
            return container;
        };
        locationControl.addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        var userLocationLatLng = null;
        function addGoogleMapsRouteLink(layer) {
            layer.on('popupopen', function (event) {
                var popupElement = event.popup.getElement();
                var content = popupElement && popupElement.querySelector('.leaflet-popup-content');
                if (!content) {
                    return;
                }
                var link = content.querySelector('.google-maps-route');
                if (!link) {
                    link = document.createElement('a');
                    link.className = 'google-maps-route';
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    content.appendChild(link);
                }
                var destination = layer.getLatLng();
                var url = 'https://www.google.com/maps/dir/?api=1';
                if (userLocationLatLng) {
                    url += '&origin=' + encodeURIComponent(userLocationLatLng.lat + ',' + userLocationLatLng.lng);
                }
                url += '&destination=' + encodeURIComponent(destination.lat + ',' + destination.lng);
                url += '&travelmode=driving';
                link.href = url;
                link.textContent = userLocationLatLng
                    ? 'Drive here in Google Maps'
                    : 'Directions in Google Maps';
                link.title = userLocationLatLng
                    ? 'Open driving directions from your location'
                    : 'Open driving directions; Google Maps may use your current location';
            });
        }

                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {

            addGoogleMapsRouteLink(layer);
        }
